# AppMana cluster: the image supplies the routed NCCL fork and USB4 libibverbs provider.
# The topology webhook supplies host networking, RDMA devices, memlock, and MASTER_ADDR/PORT.
# BENCHMARK_STEPS=50 runs the full fixed-caption workflow instead of the two-step check.
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: comfy-hy3-pp2-benchmark
  namespace: spellsource
  labels:
    kueue.x-k8s.io/priority-class: experiment
    kueue.x-k8s.io/queue-name: tb-chain
spec:
  failurePolicy:
    maxRestarts: 0
    restartStrategy: Recreate
  network:
    enableDNSHostnames: true
    publishNotReadyAddresses: true
  replicatedJobs:
  - groupName: default
    name: rank
    replicas: 2
    template:
      metadata: {}
      spec:
        backoffLimit: 0
        completionMode: Indexed
        completions: 1
        parallelism: 1
        template:
          metadata:
            labels:
              appmana.com/tb-chain-hostnet: primary
              appmana.com/tb-chain-nccl-transport: ibverbs
            annotations:
              kueue.x-k8s.io/podset-required-topology: appmana.com/tb-chain-name
              kueue.x-k8s.io/podset-slice-required-topology: appmana.com/tb-chain-index
              kueue.x-k8s.io/podset-slice-size: '1'
          spec:
            containers:
            - command:
              - /bin/bash
              - -lc
              - "set -euo pipefail\nexport RANK=\"${JOBSET_JOB_INDEX}\" WORLD_SIZE=2\
                \ LOCAL_RANK=0 LOCAL_WORLD_SIZE=1\nexport NCCL_IB_HCA=usb4_rdma NCCL_NET=IB\
                \ NCCL_NET_PLUGIN=none\nPRIMARY_IFACE=\"$(awk '$2 == \"00000000\"\
                \ {print $1; exit}' /proc/net/route)\"\nexport NCCL_SOCKET_IFNAME=\"\
                ${PRIMARY_IFACE}\" GLOO_SOCKET_IFNAME=\"${PRIMARY_IFACE}\"\nuv pip\
                \ install --no-deps \"comfyui @ https://github.com/hiddenswitch/pip-and-uv-installable-ComfyUI/archive/${COMFYUI_REVISION}.tar.gz\"\
                \nuv pip install --no-deps --extra-index-url https://nodes.appmana.com/simple\
                \ \"comfyui-hunyuanimage3==0.1.0\"\nOUT=\"/outputs/comfy-hy3-pp2-benchmark/${JOBSET_UID}\"\
                \nmkdir -p \"${OUT}\" /workspace/comfyui\nibv_devices\npython - <<'CHECK'\n\
                import torch\nprint(torch.__version__,torch.cuda.get_device_name(0),flush=True)\n\
                CHECK\nif [ \"${RANK}\" -eq 0 ]; then\npython - <<'WEIGHTS'\nfrom\
                \ huggingface_hub import hf_hub_download\nfor name in ('vae/hunyuan_image_3_vae_fp16.safetensors','hunyuan_image_3_instruct_w4a8.safetensors'):\n\
                \ print(hf_hub_download('PedroMarinhoDev/HunyuanImage-3.0-Instruct-ComfyUI',name),flush=True)\n\
                WEIGHTS\ncurl -fsSL \"https://raw.githubusercontent.com/hiddenswitch/pip-and-uv-installable-ComfyUI/${COMFYUI_REVISION}/release-artifacts/workflows/api/hunyuan-instruct-fixed-rewrite-txt2img.json\"\
                \ -o \"${OUT}/workflow.json\"\npython - \"${OUT}/workflow.json\" <<'STEPS'\n\
                import json, os, sys\nfrom pathlib import Path\npath = Path(sys.argv[1])\n\
                workflow = json.loads(path.read_text())\nfor node in workflow.values():\n\
                \    if node.get(\"class_type\") == \"KSampler\":\n        node[\"\
                inputs\"][\"steps\"] = max(2, int(os.environ[\"BENCHMARK_STEPS\"]))\n\
                path.write_text(json.dumps(workflow))\nSTEPS\ntouch \"${OUT}/weights.ready\"\
                \nelse\nuntil [ -e \"${OUT}/weights.ready\" ]; do sleep 5; done\n\
                fi\npython - <<'STAGE'\nfrom pathlib import Path\nfrom shutil import\
                \ copyfile\nfrom huggingface_hub import hf_hub_download\nfor filename,\
                \ directory in (\n    ('hunyuan_image_3_instruct_w4a8.safetensors',\
                \ 'diffusion_models'),\n    ('vae/hunyuan_image_3_vae_fp16.safetensors',\
                \ 'vae'),\n):\n    source = hf_hub_download('PedroMarinhoDev/HunyuanImage-3.0-Instruct-ComfyUI',\
                \ filename, local_files_only=True)\n    destination = Path('/workspace/comfyui/models')\
                \ / directory / Path(filename).name\n    destination.parent.mkdir(parents=True,\
                \ exist_ok=True)\n    copyfile(source, destination)\nSTAGE\ncd /workspace/comfyui\n\
                curl -fsSL \"https://raw.githubusercontent.com/hiddenswitch/pip-and-uv-installable-ComfyUI/${COMFYUI_REVISION}/tests/inference_benchmark.py\"\
                \ -o /tmp/comfy_benchmark.py\nexport COMFY_BENCHMARK_PATH=\"${OUT}/step2-rank${RANK}.jsonl\"\
                \nHF_HUB_OFFLINE=1 python -c 'import os,sys; sys.path.insert(0,\"\
                /tmp\"); from comfy_benchmark import install_benchmark; patches=install_benchmark(os.environ[\"\
                COMFY_BENCHMARK_PATH\"]); from comfy.cmd.cli import entrypoint; entrypoint()'\
                \ workflows run \"${OUT}/workflow.json\" --output-directory \"${OUT}\"\
                \ --no-guess-settings --tensor-parallel-size 1 --pipeline-parallel-size\
                \ 2 --distributed-executor-backend external_launcher --logging-level\
                \ INFO 2>&1 | tee \"${OUT}/rank${RANK}.log\"\n"
              env:
              - name: COMFYUI_REVISION
                value: 33a27d8c98d556475b6eb8637d189685475400dd
              - name: JOBSET_JOB_INDEX
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/job-index']
              - name: JOBSET_REPLICATEDJOB_REPLICAS
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/replicatedjob-replicas']
              - name: JOBSET_UID
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.labels['jobset.sigs.k8s.io/jobset-uid']
              - name: HF_HOME
                value: /cache/huggingface
              - name: HF_TOKEN
                valueFrom:
                  secretKeyRef:
                    key: HF_TOKEN
                    name: hf-token
              - name: CUDA_VISIBLE_DEVICES
                value: '0'
              - name: NCCL_DEBUG
                value: INFO
              - name: NCCL_DEBUG_SUBSYS
                value: INIT,NET
              - name: BENCHMARK_STEPS
                value: '2'
              image: ghcr.io/appmana/forks-diffusion-pipe-prod:1d7a529
              name: rank
              resources:
                limits:
                  cpu: '16'
                  memory: 60Gi
                  nvidia.com/gpu: '24'
                requests:
                  cpu: '8'
                  memory: 16Gi
                  nvidia.com/gpu: '24'
              volumeMounts:
              - mountPath: /cache/huggingface
                name: hf-cache
              - mountPath: /outputs
                name: outputs
              - mountPath: /dev/shm
                name: dshm
            enableServiceLinks: false
            imagePullSecrets:
            - name: image-pull-secret
            nodeSelector:
              appmana.com/tb-chain-name: primary
              kubernetes.io/os: linux
            restartPolicy: Never
            volumes:
            - name: hf-cache
              persistentVolumeClaim:
                claimName: hf-cache-shared
            - name: outputs
              persistentVolumeClaim:
                claimName: diffusion-pipe-outputs
            - emptyDir:
                medium: Memory
                sizeLimit: 16Gi
              name: dshm
        activeDeadlineSeconds: 3600
  startupPolicy:
    startupPolicyOrder: AnyOrder
  successPolicy:
    operator: All
  suspend: true
