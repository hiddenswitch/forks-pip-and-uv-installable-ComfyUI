# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Backend Tests

# Full validation happens once in test-latest.yml. These jobs exercise the
# device-specific install, imports, kernels, compatibility shims, and model
# backends that a hosted CPU runner cannot cover.
on:
  workflow_dispatch:
    inputs:
      backend:
        description: Backend to validate
        type: choice
        default: all
        options: [all, intel, windows_nvidia, macos]
      model_filter:
        description: Optional pytest expression for targeted macOS model diagnostics
        type: string
        default: ""
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.backend || 'all' }}-${{ inputs.model_filter && github.run_id || 'full' }}
  cancel-in-progress: true

env:
  SAM2_BUILD_CUDA: "0"
  COMFYUI_LINUX_SYSTEM_PACKAGES: >-
    libgl1 libglib2.0-0 libsndfile1 libxcb1 zip unzip zstd

jobs:
  intel:
    if: github.event_name != 'workflow_dispatch' || inputs.backend == 'all' || inputs.backend == 'intel'
    environment: Testing
    name: Python 3.14 PyTorch 2.14 XPU
    runs-on: [self-hosted, linux, X64, ipex-a380-6gb]
    # Container scheduling and first-use GPU compilation count toward this limit.
    timeout-minutes: 60
    container:
      image: intel/intel-extension-for-pytorch:2.8.10-xpu
      options: --shm-size=8g
    env:
      ONEAPI_DEVICE_SELECTOR: level_zero:0
      # Triton recognizes DG2 G10 but misses the A380's G11 architecture id.
      TRITON_INTEL_DEVICE_ARCH: dg2
      SYCL_CACHE_PERSISTENT: "1"
      SYCL_CACHE_DIR: /opt/comfyui-ci-cache/sycl
      PYTORCH_JIT: "0"
      COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
    steps:
      - name: Install system dependencies and uv
        run: |
          find /etc/apt -type f \( -name '*.list' -o -name '*.sources' \) -exec \
            sed -i 's|http://archive.ubuntu.com/ubuntu|http://mirrors.kernel.org/ubuntu|g' {} +
          apt-get update --error-on=any
          apt-get install -y --no-install-recommends curl ca-certificates git $COMFYUI_LINUX_SYSTEM_PACKAGES
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - uses: actions/checkout@v7
      - name: Create Python 3.14 environment
        run: uv venv --python 3.14.7 .venv
      - name: Install locked dependencies
        run: ci/install-locked.sh ci/locks/pylock.linux-py314-xpu.toml .venv/bin/python
      - name: XPU smoke
        run: |
          mkdir -p "$SYCL_CACHE_DIR"
          .venv/bin/python - <<'PY'
          import sys
          import torch
          import torchvision
          import torchaudio
          assert sys.version_info[:3] == (3, 14, 7)
          print("torch", torch.__version__)
          assert torch.__version__ == "2.14.1+xpu"
          assert torchvision.__version__ == "0.29.1+xpu"
          assert torchaudio.__version__ == "2.11.0+xpu"
          assert torch.xpu.is_available()
          print("device", torch.xpu.get_device_name(0))
          result = (torch.ones(16, device="xpu") * 2).sum()
          torch.xpu.synchronize()
          assert result.item() == 32
          compiled = torch.compile(lambda x: (x * 2).sum())
          assert compiled(torch.ones(16, device="xpu")).item() == 32
          PY
      - name: Custom-node registration
        run: .venv/bin/python -m pytest -v -s --timeout=900 tests/custom_nodes/test_installed_node_registration.py
      - name: XPU unit tests
        run: |
          .venv/bin/python -m pytest -v -rs --expected-device=xpu --junitxml=xpu-tests.xml --timeout=900 tests/unit --ignore=tests/unit/test_workflow_convert_playwright.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: xpu-test-results
          path: xpu-tests.xml

  windows_nvidia:
    if: github.event_name != 'workflow_dispatch' || inputs.backend == 'all' || inputs.backend == 'windows_nvidia'
    environment: Testing
    name: Windows RTX 3090 Python 3.14 CUDA 13.0 PyTorch 2.14
    runs-on: [self-hosted, windows-cuda-3090-24gb]
    # Cold dependency setup plus serial process tests can exceed two hours.
    timeout-minutes: 180
    container:
      image: harbor.appmana.com/appmana-shared/buildervscuda:windows-1.0.1-ltsc2022
    env:
      # The prepared interpreter and venv are restored here on local NTFS.
      # SeaweedFS stores only their immutable archive, never live package files.
      UV_PYTHON_INSTALL_DIR: C:/ci-python
    defaults:
      run:
        shell: sh -e {0}
    steps:
      - name: Checkout git repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper store
          git config --global core.longpaths true
          echo "https://x-access-token:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Prepare Windows environment
        run: ci/setup-windows.sh
      - name: CUDA smoke
        run: |
          C:/venv/Scripts/python.exe - <<'PY'
          import sys
          import torch
          import torchvision
          import torchaudio
          assert sys.version_info[:3] == (3, 14, 7), sys.version_info
          print("torch", torch.__version__, "cuda", torch.version.cuda, "device", torch.cuda.get_device_name(0))
          assert torch.__version__ == "2.14.1+cu130"
          assert torchvision.__version__ == "0.29.1+cu130"
          assert torchaudio.__version__ == "2.11.0+cu130"
          assert torch.version.cuda == "13.0"
          assert torch.cuda.is_available()
          result = (torch.ones(16, device="cuda") * 2).sum()
          torch.cuda.synchronize()
          assert result.item() == 32
          PY
          # Publish only after the smoke check; cache failures must not skip tests.
          if [ ! -f C:/.comfy-environment-cache-hit ]; then
            C:/Python312/python.exe ci/windows_environment_cache.py save || echo '::warning::Environment cache publication failed'
          fi
      - name: Custom-node registration
        run: C:/venv/Scripts/python.exe -m pytest -v -s --timeout=900 tests/custom_nodes/test_installed_node_registration.py
      - name: Windows unit tests
        env:
          COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
        run: |
          C:/venv/Scripts/python.exe -m pytest -v -n 4 --timeout=900 -m "not server_process" tests/unit
      - name: Windows server process unit tests
        env:
          COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
          # Importing Torch and the packaged nodes in a fresh Windows process
          # takes longer than the default readiness budget. Run these tests
          # after the parallel phase so child processes have the host to
          # themselves.
          COMFYUI_TEST_SERVER_STARTUP_TIMEOUT: "240"
        run: |
          C:/venv/Scripts/python.exe -m pytest -v --timeout=900 -m server_process tests/unit

  macos:
    # Hosted MPS validation is disabled until runner capacity is available.
    if: false
    environment: Testing
    name: macOS 15 MPS Python 3.12 PyTorch 2.13
    runs-on: macos-15-xlarge
    timeout-minutes: 60
    env:
      # uv otherwise evaluates wheels against its generic macOS 13 floor.
      # PyTorch 2.13 and ONNX Runtime publish native macOS 14 arm64 wheels.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: ci/locks/pylock.macos-py312.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          uv venv --python 3.12
          ci/install-locked.sh ci/locks/pylock.macos-py312.toml .venv/bin/python
      - name: MPS execution smoke
        run: |
          .venv/bin/python - <<'PY'
          import torch
          from comfy.model_management import get_torch_device
          print('torch', torch.__version__, 'device', get_torch_device())
          assert torch.__version__.startswith('2.13.0')
          assert torch.backends.mps.is_available()
          assert get_torch_device().type == 'mps'
          result = (torch.ones(16, device='mps') * 2).sum()
          torch.mps.synchronize()
          assert result.item() == 32
          PY
      - name: Custom-node registration
        run: .venv/bin/python -m pytest -v -s --timeout=900 tests/custom_nodes/test_installed_node_registration.py
      - name: macOS smoke tests
        env:
          COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
        run: |
          .venv/bin/python -m pytest -v \
            tests/unit/test_cli.py \
            tests/unit/test_comfy_instance.py \
            tests/unit/test_guess_settings.py \
            tests/unit/test_torchvision_compat.py \
            tests/unit/test_transformers_compat.py
      - name: Miniature model inference on MPS
        env:
          MODEL_FILTER: ${{ inputs.model_filter || '' }}
        run: |
          brew install ggml
          export COMFYUI_TEST_GGML_LIBRARY="$(brew --prefix ggml)/lib/libggml-base.dylib"
          test -f "$COMFYUI_TEST_GGML_LIBRARY"
          df -h .
          .venv/bin/python -m pytest -vv -rs --capture=tee-sys --durations=15 --timeout=900 --weights mini --expected-device=mps -k "$MODEL_FILTER" \
            --junitxml=mps-inference.xml tests/inference/test_workflows.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mps-inference-results
          path: mps-inference.xml
