# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Backend Tests

# Full validation happens once in test-latest.yml. These jobs exercise the
# device-specific install, imports, kernels, compatibility shims, and model
# backends that a hosted CPU runner cannot cover.
on:
  workflow_dispatch:
  push:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SAM2_BUILD_CUDA: "0"
  UBUNTU_APT_MIRROR: https://mirrors.kernel.org/ubuntu
  COMFYUI_LINUX_SYSTEM_PACKAGES: >-
    libgl1 libglib2.0-0 libsndfile1 libxcb1 zip unzip

jobs:
  intel:
    environment: Testing
    name: Python 3.14 PyTorch 2.14 XPU
    runs-on: [self-hosted, linux, X64, ipex-a380-6gb]
    timeout-minutes: 30
    container:
      image: intel/intel-extension-for-pytorch:2.8.10-xpu
      options: --shm-size=8g
    env:
      ONEAPI_DEVICE_SELECTOR: level_zero:0
      # Triton recognizes DG2 G10 but misses the A380's G11 architecture id.
      TRITON_INTEL_DEVICE_ARCH: dg2
      SYCL_CACHE_PERSISTENT: "1"
      SYCL_CACHE_DIR: /opt/comfyui-ci-cache/sycl
      PYTORCH_JIT: "0"
      COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
    steps:
      - name: Install system dependencies and uv
        run: |
          apt-get update
          apt-get install -y --no-install-recommends curl ca-certificates git $COMFYUI_LINUX_SYSTEM_PACKAGES
          curl -LsSf https://astral.sh/uv/install.sh | sh
      - uses: actions/checkout@v7
      - name: Create Python 3.14 environment
        run: uv venv --python 3.14.7 .venv
      - name: Install locked dependencies
        run: ci/install-locked.sh ci/locks/pylock.linux-py314-xpu.toml .venv/bin/python
      - name: XPU smoke
        run: |
          mkdir -p "$SYCL_CACHE_DIR"
          .venv/bin/python - <<'PY'
          import sys
          import torch
          import torchvision
          import torchaudio
          assert sys.version_info[:3] == (3, 14, 7)
          print("torch", torch.__version__)
          assert torch.__version__ == "2.14.1+xpu"
          assert torchvision.__version__ == "0.29.1+xpu"
          assert torchaudio.__version__ == "2.11.0+xpu"
          assert torch.xpu.is_available()
          print("device", torch.xpu.get_device_name(0))
          result = (torch.ones(16, device="xpu") * 2).sum()
          torch.xpu.synchronize()
          assert result.item() == 32
          compiled = torch.compile(lambda x: (x * 2).sum())
          assert compiled(torch.ones(16, device="xpu")).item() == 32
          PY
      - name: Custom-node registration
        run: .venv/bin/python -m pytest -v -s --timeout=900 tests/custom_nodes/test_installed_node_registration.py
      - name: XPU unit tests
        run: |
          .venv/bin/python -m pytest -v --timeout=900 tests/unit

  windows_nvidia:
    environment: Testing
    name: Windows RTX 3090 Python 3.14 CUDA 13.0 PyTorch 2.14
    runs-on: [self-hosted, windows-cuda-3090-24gb]
    timeout-minutes: 120
    container:
      image: harbor.appmana.com/appmana-shared/buildervscuda:windows-1.0.1-ltsc2022
    env:
      # The prepared interpreter and venv are restored here on local NTFS.
      # SeaweedFS stores only their immutable archive, never live package files.
      UV_PYTHON_INSTALL_DIR: C:/ci-python
    defaults:
      run:
        shell: sh -e {0}
    steps:
      - name: Checkout git repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global credential.helper store
          git config --global core.longpaths true
          echo "https://x-access-token:${GITHUB_TOKEN}@github.com" > ~/.git-credentials
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Initialize Windows graphics environment
        shell: powershell
        run: '& "./.github/scripts/enable-graphics-apis.ps1"'
      - name: Configure Chocolatey cache
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path $env:CHOCO_CACHE_LOCATION | Out-Null
          choco config set cacheLocation $env:CHOCO_CACHE_LOCATION
      - name: Install cached uv
        run: |
          uv_zip="C:/ci-cache/installers/uv-0.12.2-x86_64-pc-windows-msvc.zip"
          mkdir -p "C:/ci-cache/installers"
          if [ ! -f "$uv_zip" ]; then
            tmp_zip="${uv_zip}.${GITHUB_RUN_ID:-0}.tmp"
            curl -fsSL --retry 5 -o "$tmp_zip" "https://github.com/astral-sh/uv/releases/download/0.12.2/uv-x86_64-pc-windows-msvc.zip"
            echo "01442d8ce5c7124151a73e697c836d252c6da853c18c73206d3cc4c2378a91d2  $tmp_zip" | sha256sum -c -
            mv -f "$tmp_zip" "$uv_zip"
          fi
          echo "01442d8ce5c7124151a73e697c836d252c6da853c18c73206d3cc4c2378a91d2  $uv_zip" | sha256sum -c -
          unzip -oq "$uv_zip" -d "$(dirname "$(command -v uv)")"
          uv --version
      - name: Restore prepared Windows environment from SeaweedFS
        id: environment-cache
        run: C:/Python312/python.exe ci/windows_environment_cache.py restore
      - name: Create venv and install PyTorch
        if: steps.environment-cache.outputs.hit != 'true'
        run: |
          uv venv --python 3.14.7 C:/venv
          uv pip install --python C:/venv/Scripts/python.exe \
            "torch==2.14.1+cu130" "torchvision==0.29.1+cu130" "torchaudio==2.11.0+cu130" \
            --index-url https://download.pytorch.org/whl/cu130
      - name: Install cached Windows runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $installer = "C:\ci-cache\installers\vc_redist.x64.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path $installer) | Out-Null
          if (-not (Test-Path $installer)) {
            $temporary = "$installer.$env:GITHUB_RUN_ID.tmp"
            Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile $temporary
            Move-Item -Force $temporary $installer
          }
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne "Valid") { throw "Invalid VC++ redistributable signature: $($signature.Status)" }
          Start-Process -FilePath $installer -ArgumentList "/install", "/quiet", "/norestart" -Wait
      - name: Install locked dependencies
        if: steps.environment-cache.outputs.hit != 'true'
        run: ci/install-locked.sh ci/locks/pylock.windows-py314.toml C:/venv/Scripts/python.exe
      - name: Install pinned stable-ABI CUDA extensions
        if: steps.environment-cache.outputs.hit != 'true'
        run: |
          uv pip install --python C:/venv/Scripts/python.exe --no-deps "triton-windows==3.8.0.post29" --index-url https://pypi.org/simple
          uv pip install --python C:/venv/Scripts/python.exe --no-deps "sageattention==2.2.0+cu130" --index-url https://appmana.github.io/forks-sageattention-stable-abi/cu130
          uv pip install --python C:/venv/Scripts/python.exe --no-deps "nunchaku==1.3.0.dev20260717+cu130" --index-url https://appmana.github.io/forks-nunchaku-stable-abi/cu130
          uv pip install --python C:/venv/Scripts/python.exe --no-deps -r tests/custom_nodes_stable_abi_requirements.txt --extra-index-url https://nodes.appmana.com/simple
      - name: Install current checkout into restored environment
        if: steps.environment-cache.outputs.hit == 'true'
        run: uv pip install --no-cache --python C:/venv/Scripts/python.exe --reinstall --no-deps .
      - name: CUDA smoke
        run: |
          C:/venv/Scripts/python.exe - <<'PY'
          import sys
          import torch
          import torchvision
          import torchaudio
          assert sys.version_info[:3] == (3, 14, 7), sys.version_info
          print("torch", torch.__version__, "cuda", torch.version.cuda, "device", torch.cuda.get_device_name(0))
          assert torch.__version__ == "2.14.1+cu130"
          assert torchvision.__version__ == "0.29.1+cu130"
          assert torchaudio.__version__ == "2.11.0+cu130"
          assert torch.version.cuda == "13.0"
          assert torch.cuda.is_available()
          result = (torch.ones(16, device="cuda") * 2).sum()
          torch.cuda.synchronize()
          assert result.item() == 32
          PY
      - name: Save prepared Windows environment to SeaweedFS
        if: steps.environment-cache.outputs.hit != 'true'
        # A cache outage must not prevent the actual tests from running.
        continue-on-error: true
        run: C:/Python312/python.exe ci/windows_environment_cache.py save
      - name: Custom-node registration
        run: C:/venv/Scripts/python.exe -m pytest -v -s --timeout=900 tests/custom_nodes/test_installed_node_registration.py
      - name: Windows unit tests
        env:
          COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
        run: |
          C:/venv/Scripts/python.exe -m pytest -v -n 4 --timeout=900 -m "not server_process" tests/unit
      - name: Windows server process unit tests
        env:
          COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
          # Importing Torch and the packaged nodes in a fresh Windows process
          # takes longer than the default readiness budget. Run these tests
          # after the parallel phase so child processes have the host to
          # themselves.
          COMFYUI_TEST_SERVER_STARTUP_TIMEOUT: "240"
        run: |
          C:/venv/Scripts/python.exe -m pytest -v --timeout=900 -m server_process tests/unit

  macos:
    if: github.repository == 'Comfy-Org/ComfyUI' || vars.ENABLE_MACOS_CI == 'true'
    environment: Testing
    name: macOS 14 Python 3.12 PyTorch 2.13
    runs-on: macos-14
    timeout-minutes: 20
    env:
      # uv otherwise evaluates wheels against its generic macOS 13 floor.
      # PyTorch 2.13 and ONNX Runtime publish native macOS 14 arm64 wheels.
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: ci/locks/pylock.macos-py312.toml
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: |
          uv venv --python 3.12
          ci/install-locked.sh ci/locks/pylock.macos-py312.toml .venv/bin/python
      - name: Custom-node registration
        run: .venv/bin/python -m pytest -v -s --timeout=900 tests/custom_nodes/test_installed_node_registration.py
      - name: macOS smoke tests
        env:
          COMFYUI_UNIT_DISABLE_CUSTOM_NODES: "1"
        run: |
          .venv/bin/python -c "import torch; print(torch.__version__); assert torch.__version__.startswith('2.13.0'); assert torch.backends.mps.is_built()"
          .venv/bin/python -m pytest -v \
            tests/unit/test_cli_args_types_sync.py \
            tests/unit/test_comfy_instance.py \
            tests/unit/test_guess_settings.py \
            tests/unit/test_torchvision_compat.py \
            tests/unit/test_transformers_compat.py
