name: Build and Upload Wheel
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the built wheel to (optional)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, X64, cpu]
    container:
      image: archlinux:latest
    steps:
      - name: Install system dependencies
        run: pacman -Syu --noconfirm git python uv zip github-cli
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Build wheel and sdist
        run: uv build --wheel --sdist --out-dir dist

      - name: Show artifacts
        run: ls -l dist

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'release' && inputs.release_tag == ''
        with:
          name: comfyui-dist
          path: dist/*

      # Attach the built artifacts to the GitHub release that triggered the run
      # (or a tag passed via workflow_dispatch). The `comfyui` pip-facade index
      # (comfy/custom_node_facade/builder.py GithubReleaseWheelProxySpec) serves
      # these so `pip install comfyui --extra-index-url=.../simple/` resolves the
      # fork. --clobber lets re-runs replace assets.
      - name: Upload to release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$TAG" dist/*.whl dist/*.tar.gz --clobber

      # TODO(pypi): the `comfyui` name is owned by us on PyPI. When ready to
      # publish there, enable a trusted-publisher job here, e.g.:
      #
      #   publish-pypi:
      #     needs: build
      #     if: github.event_name == 'release'
      #     runs-on: ubuntu-latest
      #     environment: pypi
      #     permissions:
      #       id-token: write
      #     steps:
      #       - uses: actions/download-artifact@v8
      #         with: { name: comfyui-dist, path: dist }
      #       - uses: pypa/gh-action-pypi-publish@release/v1
      #
      # Intentionally left disabled for now.
